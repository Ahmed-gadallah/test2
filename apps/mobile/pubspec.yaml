name: zaad
description: "Zaad Pharmacies customer loyalty app"
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.7

dependencies:
  dio: ^5.11.1
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.5.0
  flutter_secure_storage: ^11.2.0
  go_router: ^18.1.3
  intl: ^0.20.3
  local_auth: ^3.0.2
  shared_preferences: ^2.5.6
  url_launcher: ^6.3.3
  web: ^1.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/brand/zaad_logo.png
    - assets/demo/branches.json
  fonts:
    - family: IBMPlexSansArabic
      fonts:
        - asset: assets/fonts/IBMPlexSansArabic_400Regular.ttf
          weight: 400
        - asset: assets/fonts/IBMPlexSansArabic_500Medium.ttf
          weight: 500
        - asset: assets/fonts/IBMPlexSansArabic_600SemiBold.ttf
          weight: 600
        - asset: assets/fonts/IBMPlexSansArabic_700Bold.ttf
          weight: 700
