# Local development stack. Production deployment is documented separately (docs/deployment.md, TBD).
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: zaad
      POSTGRES_PASSWORD: zaad
      POSTGRES_DB: zaad
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zaad"]
      interval: 5s
      retries: 10

  backend:
    build: ./apps/backend
    env_file: ./apps/backend/.env
    environment:
      DATABASE_URL: postgres://zaad:zaad@postgres:5432/zaad
    ports: ["3000:3000"]
    depends_on:
      postgres: { condition: service_healthy }

volumes:
  pgdata:
